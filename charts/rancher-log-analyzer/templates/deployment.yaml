apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: rancher-log-analyzer
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rancher-log-analyzer
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: analyzer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MAX_UPLOAD_BYTES
              value: {{ .Values.limits.uploadBytes | quote }}
            - name: MAX_UNPACK_BYTES
              value: {{ .Values.limits.unpackBytes | quote }}
            - name: MAX_SESSION_BYTES
              value: {{ .Values.limits.sessionBytes | quote }}
            - name: MAX_ARCHIVE_FILES
              value: {{ .Values.limits.archiveFiles | quote }}
            - name: MAX_ARCHIVE_DEPTH
              value: {{ .Values.limits.archiveDepth | quote }}
            - name: MAX_INDEX_BYTES
              value: {{ .Values.limits.indexBytes | quote }}
            - name: MAX_ANALYSIS_BYTES
              value: {{ .Values.analysis.resultBytes | quote }}
            - name: ANALYSIS_SCAN_BYTES
              value: {{ .Values.analysis.scanBytes | quote }}
            - name: ANALYSIS_SCAN_FILES
              value: {{ .Values.analysis.scanFiles | quote }}
            - name: ANALYSIS_FILE_BYTES
              value: {{ .Values.analysis.fileBytes | quote }}
            - name: ANALYSIS_THRESHOLDS
              value: {{ .Values.analysis.thresholds | toJson | quote }}
            - name: LOG_CLASSIFICATION_RULES
              value: {{ .Values.logClassificationRules | toJson | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 15
            failureThreshold: 4
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: {{ .Values.emptyDirSize }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
